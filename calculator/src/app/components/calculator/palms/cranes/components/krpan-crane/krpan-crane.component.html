
<app-krpan-crane-information *ngIf="crane && !fromTrailer" [crane]="crane" (trailerSelected)="navigateToTrailer($event)"></app-krpan-crane-information>

<div *ngIf="!fromTrailer && id" class="w-full h-full flex justify-center items-center mt-16">
    <button (click)="loadCraneConfigurations(this.id!)" [disabled]="(krpanService.craneSelected$ | async)" [ngClass]="{'disabled': (krpanService.craneSelected$ | async)}" class="m-auto py-10 px-20 rounded-xl mb-2 bg-[--primary-color] active:bg-gray-700 text-base font-bold uppercase shadow hover:opacity-70 outline-none focus:outline-none">Kalkulálás</button>
</div>

<div *ngIf="(krpanService.craneSelected$ | async) && !fromTrailer" class="w-full h-full flex justify-center items-center mt-8 mb-2">
    <p>Tippek</p>
</div>
<div *ngIf="(krpanService.craneSelected$ | async) && !fromTrailer" class="w-full h-full flex justify-center items-center">
    <p-inputSwitch  [(ngModel)]="hintsChecked"></p-inputSwitch>
</div>
<div *ngIf="(krpanService.craneSelected$ | async) && !fromTrailer" class="mx-auto">
    <app-krpan-crane-calculator-hints *ngIf="hintsChecked"></app-krpan-crane-calculator-hints>
</div>

<form [formGroup]="craneFormGroup">
    <ng-container *ngIf="(krpanService.craneSelected$ | async)" class="bg-slate-200">
        <div #configElement class="flex align-middle justify-center my-10">
            <div class="w-11/12">
                <div *ngIf="craneSelected && slewingDrive" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton inputId="slewingDrive" [value]="slewingDrive" formControlName="selectedSlewingDrive"></p-radioButton>
                        <label for="slewingDrive" class="ml-2">{{ slewingDrive.namePrice }}</label>
                    </div>
                </div>
                <div *ngIf="craneSelected && craneControls.length > 0" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Vezérlés</span>
                    </div>
                    <p-listbox optionDisabled="disabledOption" (onChange)="handleCraneControlChange($event)" formControlName="selectedCraneControl" [options]="craneControls" optionLabel="namePrice"></p-listbox>                   
                </div>
                <hr *ngIf="crane && !fromTrailer" class="mb-2 mt-4 h-0.5 border-t-0 bg-black opacity-100 dark:opacity-50" />
            </div>
        </div>
        
        <app-krpan-trailer-cards *ngIf="crane && crane.trailers && (krpanService.craneSelected$ | async) && !fromTrailer" [trailers]="crane.trailers" (buttonClickEmitter)="selectTrailer($event)"></app-krpan-trailer-cards>
    </ng-container>
</form>
