
<app-krpan-trailer-information *ngIf="trailer && !fromCrane" [trailer]="trailer" (craneSelected)="navigateToCrane($event)"></app-krpan-trailer-information>

<div *ngIf="!fromCrane && id" class="w-full h-full flex justify-center items-center mt-16">
    <button (click)="loadTrailerConfigurations(this.id!)" [disabled]="(krpanService.trailerSelected$ | async)" [ngClass]="{'disabled': (krpanService.trailerSelected$ | async)}" class="m-auto py-10 px-20 rounded-xl mb-2 bg-[--primary-color] active:bg-gray-700 text-base font-bold uppercase shadow hover:opacity-80 outline-none focus:outline-none">Kalkulálás</button>
</div>
<div *ngIf="(krpanService.trailerSelected$ | async) && !fromCrane" class="w-full h-full flex justify-center items-center mt-8 mb-2">
    <p>Tippek</p>
</div>
<div *ngIf="(krpanService.trailerSelected$ | async) && !fromCrane" class="w-full h-full flex justify-center items-center">
    <p-inputSwitch  [(ngModel)]="hintsChecked"></p-inputSwitch>
</div>
<div *ngIf="(krpanService.trailerSelected$ | async) && !fromCrane" class="mx-auto">
    <app-krpan-trailer-calculator-hints *ngIf="hintsChecked"></app-krpan-trailer-calculator-hints>
</div>
<form [formGroup]="trailerFormGroup">
    <ng-container *ngIf="(krpanService.trailerSelected$ | async)" class="bg-slate-200">
        <div #configElement class="flex align-middle justify-center my-10">
            <div class="w-11/12">

                <div *ngIf="trailerSelected && cargoSpaceExtension" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-radioButton *ngIf="isCargoSpaceExtensionFree" inputId="CargoSpaceExtensionDefault" [value]="cargoSpaceExtension" formControlName="selectedCargoSpaceExtension"></p-radioButton>
                        <p-checkbox *ngIf="!isCargoSpaceExtensionFree" (onChange)="onCargoSpaceExtensionChange($event)" [value]="cargoSpaceExtension" formControlName="selectedCargoSpaceExtension" inputId="CargoSpaceExtensionSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" [attr.for]="isCargoSpaceExtensionFree ? 'CargoSpaceExtensionDefault' : 'CargoSpaceExtensionSelected'">{{cargoSpaceExtension.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && frame" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton inputId="KrpanFrame" [value]="frame" formControlName="selectedFrame"></p-radioButton>
                        <label for="KrpanFrame" class="ml-2">{{ frame.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && lamp" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton id="Lamp" [value]="lamp" formControlName="selectedLamp"></p-radioButton>
                        <label [for]="lamp.id" class="ml-2">{{ lamp.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && trailerBrakeLamps.length === 1" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton
                            inputId="TrailerBrakeLamp"
                            [value]="trailerBrakeLamps[0]"
                            formControlName="selectedTrailerBrakeLamp">
                        </p-radioButton>
                        <label for="TrailerBrakeLamp" class="ml-2">{{ trailerBrakeLamps[0].namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && trailerBrakeLamps.length > 1" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Féklámpa</span>
                    </div>
                    <p-listbox
                        (onChange)="handleTrailerBrakeLampChange($event)"
                        formControlName="selectedTrailerBrakeLamp"
                        [options]="trailerBrakeLamps"
                        optionLabel="namePrice">
                    </p-listbox>
                </div>

                <div *ngIf="trailerSelected && handBrake" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton id="HandBrake" [value]="handBrake" formControlName="selectedHandBrake"></p-radioButton>
                        <label [for]="handBrake.id" class="ml-2">{{ handBrake.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && wheelChock" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton
                            inputId="WheelChock"
                            [value]="wheelChock"
                            formControlName="selectedWheelChock">
                        </p-radioButton>
                        <label for="WheelChock" class="ml-2">{{ wheelChock.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && drawbarSteering" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton id="DrawbarSteering" [value]="drawbarSteering" formControlName="selectedDrawbarSteering"></p-radioButton>
                        <label [for]="drawbarSteering.id" class="ml-2">{{ drawbarSteering.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && supportLegs.length > 0" class="justify-content-center my-4 py-4">
                    <p-listbox
                        (onChange)="handleSupportLegChange($event)"
                        formControlName="selectedSupportLeg"
                        [options]="supportLegs"
                        optionLabel="namePrice">
                    </p-listbox>
                </div>

                <div *ngIf="trailerSelected && axeHolder && !dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton id="AxeHolder" [value]="axeHolder" formControlName="selectedAxeHolder"></p-radioButton>
                        <label [for]="axeHolder.id" class="ml-2">{{ axeHolder.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && chainsawHolder && !dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton id="ChainsawHolder" [value]="chainsawHolder" formControlName="selectedChainsawHolder"></p-radioButton>
                        <label [for]="chainsawHolder.id" class="ml-2">{{ chainsawHolder.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && fuelTankHolder && !dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton id="FuelTankHolder" [value]="fuelTankHolder" formControlName="selectedFuelTankHolder"></p-radioButton>
                        <label [for]="fuelTankHolder.id" class="ml-2">{{ fuelTankHolder.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && toolBox && !dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton id="ToolBox" [value]="toolBox" formControlName="selectedToolBox"></p-radioButton>
                        <label [for]="toolBox.id" class="ml-2">{{ toolBox.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && propulsions.length > 0"  class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Meghajtás</span>
                    </div>
                    <p-listbox optionDisabled="disabledOption" (onChange)="handlePropulsionChange($event)" formControlName="selectedPropulsion" [options]="propulsions" optionLabel="namePrice"></p-listbox>                   
                </div>

                <div *ngIf="trailerSelected && adjustableDrive && (originalPropulsion?.id === 3 || originalPropulsion?.id === 4)" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-radioButton
                            inputId="AdjustableDrive"
                            [value]="adjustableDrive"
                            formControlName="selectedAdjustableDrive">
                        </p-radioButton>
                        <label for="AdjustableDrive" class="ml-2">{{ adjustableDrive.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && adjustableDrive && (originalPropulsion?.id === 1 || originalPropulsion?.id === 2)" class="justify-content-center my-4 py-4">
                    <div class="flex">
                        <p-checkbox
                            (onChange)="onAdjustableDriveChange($event)"
                            [value]="adjustableDrive"
                            formControlName="selectedAdjustableDrive"
                            inputId="AdjustableDriveOptional">
                        </p-checkbox>
                        <label for="AdjustableDriveOptional" class="ml-2">{{ adjustableDrive.namePrice }}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && tyres.length > 0"  class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Abroncsok</span>
                    </div>
                    <p-listbox optionDisabled="disabledOption" (onChange)="handleTyreChange($event)" formControlName="selectedTyre" [options]="tyres" optionLabel="namePrice"></p-listbox>
                </div>

                <div *ngIf="trailerSelected && brakes.length > 0" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Fék</span>
                    </div>
                    <p-listbox optionDisabled="disabledOption" (onChange)="handleBrakeChange($event)" formControlName="selectedBrake" [options]="brakes" optionLabel="namePrice"></p-listbox>
                </div>

                <div *ngIf="trailerSelected && stanchions.length > 0" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Rakonca</span>
                    </div>
                    <p-listbox (onChange)="handleStanchionChange($event)" formControlName="selectedStanchion" [options]="stanchions" optionLabel="namePrice"></p-listbox>
                </div>

                <div *ngIf="trailerSelected && clutches.length > 0" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Tengelykapcsoló</span>
                    </div>
                    <p-listbox optionDisabled="disabledOption" (onChange)="handleClutchChange($event)" formControlName="selectedClutch" [options]="clutches" optionLabel="namePrice"></p-listbox>
                </div>

                <div *ngIf="trailerSelected && drawBars.length > 0" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Vonószerkezet</span>
                    </div>
                    <p-listbox optionDisabled="disabledOption" (onChange)="handleDrawbarChange($event)" formControlName="selectedDrawBar" [options]="drawBars" optionLabel="namePrice"></p-listbox>                   
                </div>

                <div *ngIf="trailerSelected && couplingDevices.length > 0" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <span>Vonórúd</span>
                    </div>
                    <p-listbox optionDisabled="disabledOption" (onChange)="handleCouplingDeviceChange($event)" formControlName="selectedCouplingDevice" [options]="couplingDevices" optionLabel="namePrice"></p-listbox>                   
                </div>

                <div *ngIf="trailerSelected && cardanShaft" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onCardanShaftChange($event)" [value]="cardanShaft" formControlName="selectedCardanShaft" inputId="CardanShaftSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="CardanShaftSelected">{{cardanShaft.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && bBox" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onBBoxChange($event)" [value]="bBox" formControlName="selectedBBox" inputId="BBoxSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="BBoxSelected">{{bBox.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && baleTransportPlatform" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onBaleTransportPlatformChange($event)" [value]="baleTransportPlatform" formControlName="selectedBaleTransportPlatform" inputId="BaleTransportPlatformSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="BaleTransportPlatformSelected">{{baleTransportPlatform.namePrice}}</label>
                    </div>
                </div>


                <div *ngIf="trailerSelected && axeHolder && dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onAxeHolderChange($event)" [value]="axeHolder" formControlName="selectedAxeHolder" inputId="AxeHolderSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="AxeHolderSelected">{{axeHolder.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && chainsawHolder && dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onChainsawHolderChange($event)" [value]="chainsawHolder" formControlName="selectedChainsawHolder" inputId="ChainsawHolderSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="ChainsawHolderSelected">{{chainsawHolder.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && fuelTankHolder && dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onFuelTankHolderChange($event)" [value]="fuelTankHolder" formControlName="selectedFuelTankHolder" inputId="FuelTankHolderSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="FuelTankHolderSelected">{{fuelTankHolder.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && toolBox && dfTrailerIds.includes(trailer.id)" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onToolBoxChange($event)" [value]="toolBox" formControlName="selectedToolBox" inputId="ToolBoxSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="ToolBoxSelected">{{toolBox.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && plato" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onPlatoChange($event)" [value]="plato" formControlName="selectedPlato" inputId="PlatoSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="PlatoSelected">{{plato.namePrice}}</label>
                    </div>
                </div>

                <div *ngIf="trailerSelected && extension" class="justify-content-center my-4 py-4">
                    <div class="flex gap-2">
                        <p-checkbox (onChange)="onExtensionChange($event)" [value]="extension" formControlName="selectedExtension" inputId="ExtensionSelected"></p-checkbox>
                        <label class="hover:cursor-pointer" for="ExtensionSelected">{{extension.namePrice}}</label>
                    </div>
                </div>
                <hr *ngIf="trailer && !fromCrane" class="mb-2 mt-4 h-0.5 border-t-0 bg-black opacity-100 dark:opacity-50" />
            </div>
        </div>

        <app-krpan-crane-cards *ngIf="trailer && trailer.cranes && trailerSelected && (krpanService.trailerSelected$ | async) && !fromCrane" [cranes]="trailer.cranes" (buttonClickEmitter)="selectCrane($event)"></app-krpan-crane-cards>
    </ng-container>
</form>
